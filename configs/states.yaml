# State registry: where each state's game-unit boundary polygons come from.
#
# Consumed at PROFILE-GENERATION time (scripts/gen_profile.py) — generated
# configs carry their own `boundary:` block, so pipeline fetches never read
# this file. New states are appended by the onx-scout skill after it verifies
# a service per .claude/skills/onx-scout/references/state-discovery.md.
#
# status: verified    = a live query for a real unit returned its polygon
#         provisional = entry written where egress blocked live verification;
#                       confirm on a machine with GIS access before trusting

version: 1
states:
  ID:
    name: Idaho
    agency: Idaho Department of Fish and Game
    unit_system: "GMU (numbered, some lettered subunits, e.g. 33, 39, 45A)"
    boundary:
      base_url: "https://gisportal-idfg.idaho.gov/hosting/rest/services/Hunting/MapServer"
      alt_urls:
        - "https://gis.idfg.idaho.gov/server/rest/services/Hunting/MapServer"
      layer: 3
      layer_hint: "unit"
      unit_field: null              # discovered at runtime
      unit_field_hints: ["NAME", "UNIT", "GMU"]
      unit_value_format: "{unit}"
    land_access:
      open_agencies: [BLM, USFS, BOR, STATE]
      notes: >-
        Idaho endowment (state) land is generally open to public hunting
        unless posted; verify parcel status with the Idaho Department of Lands.
    elevation_offset_ft: 0
    elevation_offset_source: "Templates are calibrated on Idaho unit 33."
    provenance:
      verified: "2026-08-28"
      status: verified
      notes: >-
        Same IDFG service elkscout has used since v1 (layer 3 GMU polygons;
        unit-name field discovered from layer metadata). Verified during the
        original unit-33 build.
  CO:
    name: Colorado
    agency: Colorado Parks and Wildlife
    unit_system: "GMU (numbered, e.g. 68, 681)"
    boundary:
      base_url: "https://services5.arcgis.com/ttNGmDvKQA7oeDQ3/ArcGIS/rest/services/CPWAdminData/FeatureServer"
      alt_urls: []
      layer: 6
      layer_hint: "gmu"
      unit_field: "GMUID"           # integer field; the quoted-string where clause still matches
      unit_field_hints: ["GMUID", "GMU"]
      unit_value_format: "{unit}"
    land_access:
      open_agencies: [BLM, USFS, BOR]
      notes: >-
        Colorado State Trust Land is CLOSED to hunting unless enrolled in CPW's
        Public Access Program; enrolled parcels go in
        data/manual/public_access.geojson (each has its own rules - e.g. Burro
        Springs bans OHV game retrieval). Local-government land is closed.
    elevation_offset_ft: 3000
    elevation_offset_source: >-
      GMU 68/681 run, Nov 2026: hunter-approved +3,000 ft so the Idaho template's
      October optimum (5,800-7,400 ft late-season) lands on goHUNT's 9,000-11,000 ft
      range for unit 681. An informed estimate, not a CPW figure.
    provenance:
      verified: "2026-11-08"
      status: verified
      notes: >-
        CPW ArcGIS Online CPWAdminData FeatureServer, layer 6 "CPW GMU Boundary
        (Big Game)". Check 1: service JSON lists 30 layers. Check 2: layer 6 is
        esriGeometryPolygon with integer GMUID (plus COUNTY, ELKDAU, DEERDAU).
        Check 3: statewide count 186. Check 4: GMUID IN (68,681,682) returned 3
        features, and the pipeline's own clause "GMUID" = '681' returned count 1.
        All checks run with WebFetch on 2026-11-08 (the sandbox shell's egress
        proxy blocked arcgis.com).
