# The onx-scout adjustment matrix: how season phase, hunt style, and weapon
# reshape a species template. Numeric source of truth for scripts/gen_profile.py.
#
# Composition (applied by gen_profile.py, in this order):
#   template -> phase cell -> style overlay -> weapon overlay
#   then: factor weights renormalized to sum 1.0; waypoint counts rounded
#   (min 1 unless multiplier is 0) and clamped to outputs.gpx_max_waypoints;
#   elevation-curve x values sanity-clamped to [3000, 11500] ft; the result
#   must pass elkscout.config.load_config or generation fails.
#
# Cell fields:
#   window  - month-day span (inclusive) used to derive the phase from the
#             hunt start date; --phase overrides.
#   weights - factor-weight MULTIPLIERS (renormalized afterwards).
#   curves  - wholesale replacement of a factors.<factor>.<curve> list.
#   set     - absolute set of a dotted config path (non-curve scalars/lists).
#   counts  - waypoint-count multipliers by type.
# Layer conflicts: curves never merge — if two layers write the same curve the
# LATER layer wins (styles out-rank phases on the security curve by design:
# how far you can hunt from the truck beats how far game sits from roads).

version: 1

phases:
  elk:
    rut:
      window: { start: "08-15", end: "09-30" }
      notes: >-
        September rut: bulls with cows on high summer range; wallows and seep
        water are magnets; hunts happen close in bed-adjacent timber off
        calling, and pressure is lighter than rifle season.
      weights: { water: 1.7, feed: 0.8, security: 0.9 }
      curves:
        security.curve_dist_motorized_km: [[0, 0.0], [0.4, 0.2], [0.8, 1.0], [3.0, 1.0], [5.0, 0.7], [9.0, 0.6]]
        elevation.curve_elevation_ft: [[4800, 0.0], [5800, 0.5], [6300, 1.0], [8500, 1.0], [9000, 0.6]]
        water.curve_dist_water_m: [[0, 1.0], [250, 1.0], [700, 0.3], [1600, 0.0]]
      counts: { WATER: 1.5, SADDLE: 1.25, GLASS: 0.6 }

    general:
      window: { start: "10-01", end: "11-07" }
      notes: "October general rifle: the template IS this phase. No deltas."

    late:
      window: { start: "11-08", end: "12-31" }
      notes: >-
        Post-rut/migration: snow pushes elk onto lower south-facing feed; bulls
        are recovering and feed-driven; water is snow; glassing winter-range
        edges beats still-hunting dark timber.
      weights: { feed: 1.4, water: 0.5, elevation: 1.15 }
      curves:
        elevation.curve_elevation_ft: [[4200, 0.0], [5000, 0.6], [5800, 1.0], [7400, 1.0], [8800, 0.0]]
        bedding.curve_canopy_pct: [[20, 0.0], [40, 1.0], [70, 1.0], [100, 0.8]]
      set:
        factors.bedding.aspect_center_deg: 180   # thermal bedding on south faces
        snow.band_shift_ft: [[0, 0], [6, -800], [12, -1800], [24, -3000]]
      counts: { GLASS: 1.5, FEED: 1.25, WATER: 0.4 }

  mule_deer:
    high_country:
      window: { start: "08-15", end: "09-30" }
      notes: >-
        September alpine pattern: bachelor and early-solo bucks on predictable
        summer range — cliff-shade beds, forb benches at dawn/dusk, daily water
        in the heat. A spot-and-stalk glassing game.
      weights: { security: 0.85, feed: 1.1, water: 1.2 }
      curves:
        elevation.curve_elevation_ft: [[7200, 0.0], [7800, 0.6], [8200, 1.0], [9800, 1.0], [10400, 0.7]]
        bedding.curve_canopy_pct: [[0, 0.6], [5, 1.0], [30, 1.0], [60, 0.3], [100, 0.1]]
        bedding.curve_slope_pct: [[10, 0.2], [45, 1.0], [85, 1.0], [100, 0.5]]
      counts: { GLASS: 1.6, BED: 1.2, WATER: 0.8 }

    transition:
      window: { start: "10-01", end: "11-03" }
      notes: "October rifle transition: the template IS this phase. No deltas."

    rut:
      window: { start: "11-04", end: "12-31" }
      notes: >-
        November rut: bucks are wherever doe groups feed — winter-range
        transition shrub on low south aspects. Find feed, find does, find
        bucks; glass all day, pressure concentrates on winter-range roads.
      weights: { feed: 1.5, water: 0.6, pressure: 1.2, security: 0.9 }
      curves:
        elevation.curve_elevation_ft: [[4200, 0.0], [4800, 0.6], [5200, 1.0], [7000, 1.0], [8200, 0.0]]
        bedding.curve_canopy_pct: [[0, 0.2], [20, 1.0], [50, 1.0], [80, 0.4], [100, 0.2]]
      set:
        snow.band_shift_ft: [[0, 0], [6, -800], [12, -1800], [24, -3000]]
      counts: { GLASS: 1.6, FEED: 1.4, WATER: 0.4 }

styles:
  day:
    notes: "Day hunts: country must be reachable at dawn and packable by dark; no camps."
    curves:
      security.curve_dist_motorized_km: [[0, 0.0], [0.3, 0.3], [0.8, 1.0], [2.5, 1.0], [4.0, 0.5], [6.0, 0.15]]
    counts: { CAMP: 0, ACCESS: 1.5 }

  backpack:
    notes: "Backpack: the template default — optimum 1.2–4 km security, water-adjacent camps."

  horseback:
    notes: "Stock extends reach: deep country stays live; camps need graze and trail access."
    curves:
      security.curve_dist_motorized_km: [[0, 0.0], [0.8, 0.3], [2.0, 1.0], [6.0, 1.0], [9.0, 0.8], [12.0, 0.6]]
    set:
      camp.trailhead_km: [3.0, 9.0]
    counts: { ACCESS: 1.2 }

weapons:
  # The templates are already rifle-emphasis profiles (unit 33 heritage), so
  # rifle is the identity; archery/muzzleloader adjust relative to it.
  rifle:
    notes: "Glass first, move second; 300+ yd setups off vantages and saddles."
  muzzleloader:
    notes: "100–150 yd: the vantage matters less than the final approach."
    counts: { GLASS: 0.9, SADDLE: 1.2 }
  archery:
    notes: "Under 60 yd: wind is everything — water, wallows, and travel pinches."
    counts: { WATER: 1.4, SADDLE: 1.4, GLASS: 0.7 }
