# ElkScout species template: MULE DEER — identity cell "October rifle (transition), backpack".
#
# Differences from the elk template, on purpose (test-guarded):
# - Weights: security up (.27), pressure up (.12), water down (.08) — rifle deer
#   are road-shy browsers that drink less predictably than elk.
# - Bedding: open, rocky, steeper — canopy optimum 10–50% (elk want 60%+),
#   usable slope to 80% grade, flatter aspect preference (bucks bed south too).
# - Feed: BROWSE over grass — NLCD 52 shrub = 1.0, 71 grass = 0.7; burn window
#   stretched (bitterbrush/ceanothus regen feeds deer for two decades).
# - Elevation: a hair lower and wider than elk's October band.
# scripts/gen_profile.py applies phase (high_country/transition/rut), style,
# and weapon deltas from configs/adjustments.yaml on top of this file.

profile: mule-deer-base-template
unit: "0"   # placeholder; gen_profile.py sets the real unit

hunt_window:
  start: 2026-10-15
  end: 2026-10-24

grid:
  res_m: 30
  epsg: 32611
  buffer_m: 2000

snow:
  # Same snow response as elk: depth at the stations pushes the band down.
  band_shift_ft: [[0, 0], [6, -400], [12, -900], [24, -1500]]
  station_bbox_pad_deg: 0.25

factors:
  elevation:
    weight: 0.15
    curve_elevation_ft: [[4800, 0.0], [5600, 0.5], [6200, 1.0], [8600, 1.0], [9200, 0.6]]

  security:
    weight: 0.27
    # Rifle-season deer hold off roads hard; optimum 1.0–3.5 km.
    curve_dist_motorized_km: [[0, 0.0], [0.4, 0.05], [0.7, 0.5], [1.0, 1.0], [3.5, 1.0], [5.5, 0.6], [9.0, 0.5]]

  bedding:
    weight: 0.20
    aspect_center_deg: 22       # still favor cool aspects...
    aspect_exponent: 1.0        # ...but flatter: deer bed south slopes too
    curve_canopy_pct: [[0, 0.35], [10, 1.0], [50, 1.0], [75, 0.4], [100, 0.2]]
    curve_slope_pct: [[5, 0.2], [25, 1.0], [60, 1.0], [80, 0.3], [100, 0.0]]
    bench_bonus: 0.2
    slope_position_min: 0.55    # upper-slope, escape-terrain bedder
    snow_aspect_center_deg: null  # set by late-season phases; used only once snow reaches the band

  feed:
    weight: 0.18
    curve_burn_age_yr: [[2, 0.0], [3, 0.6], [6, 1.0], [14, 1.0], [20, 0.4]]
    edge_dist_m: 150
    interior_mult: 0.7
    aspect_center_deg: 157      # SSE browse slopes
    aspect_mix: 0.45
    landcover_scores: {52: 1.0, 71: 0.7, 90: 0.6, 95: 0.6}  # browse over grass

  water:
    weight: 0.08
    curve_dist_water_m: [[0, 1.0], [600, 1.0], [1500, 0.4], [3000, 0.0]]

  pressure:
    weight: 0.12
    curve_dist_trailhead_km: [[0, 0.2], [1.5, 0.6], [3.0, 1.0]]

masks:
  public_only: true
  max_slope_pct: 80             # deer live in goat country; mask only true cliffs

type_profiles:
  BED:   { bedding: 0.40, security: 0.30, elevation: 0.15, feed: 0.05, water: 0.03, pressure: 0.07 }
  FEED:  { feed: 0.42, security: 0.25, elevation: 0.13, bedding: 0.05, water: 0.07, pressure: 0.08 }
  WATER: { water: 0.40, security: 0.27, elevation: 0.15, bedding: 0.10, pressure: 0.08 }

camp:
  max_slope_pct: 10
  max_water_dist_m: 400
  trailhead_km: [2.4, 5.6]

waypoints:
  min_spacing_m: 700
  cross_type_spacing_m: 300
  score_floor: 0.45
  counts: { BED: 15, FEED: 15, WATER: 6, SADDLE: 10, GLASS: 10, CAMP: 6, ACCESS: 8 }
  saddle:
    dem_downsample_m: 90
    travel_max_km: 2.0
  glass:
    viewshed_radius_km: 2.5
    max_candidates: 60

hunt_areas:
  min_waypoints: 6
  min_areas: 4
  max_areas: 8

outputs:
  gpx_max_bytes: 4000000
  gpx_max_waypoints: 3000
  desc_max_chars: 450
